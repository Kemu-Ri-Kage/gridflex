# The daily settle job (daily_settle.sh, docs/specs/2026-10-13-daily-settle.md
# §13-§14, shared/oracle-v2.md). This file must be on main: GitHub runs
# schedules from the default branch only.
#
# What keeps the run honest, in the order a run meets it:
#   1. main is protected by the "Protect main" ruleset (pull request, an
#      approving review, no bypass), and the "settle" Environment hands its
#      secrets only to jobs on main.
#   2. The run executes the code of one reviewed commit: $GITHUB_SHA, the
#      exact main commit GitHub started it for, never the moving origin/main.
#      Main's own ops/settle-preflight.sh merges that commit into
#      feat/judging-sprint (where the data lives), proves with main's
#      ops/code-matches-main.sh that the two differ in data files alone, and
#      has scripts/verify_data.py approve the data: the branch may only append
#      markets, each verified on chain against shared/pins.json. Nothing is
#      ever pulled after that, and daily_settle.sh checks before every chain
#      step and push that HEAD is still that commit plus its own data commits.
#   3. Nothing goes live by default. The event and the dispatch input decide
#      whether a live run is wanted; the repository variables are compared in
#      bash, exactly: SETTLE_LIVE must be "yes" (not "YES", not "yes "), and
#      chain transactions also need SETTLE_CHAIN=yes and a GridOracleV2 pinned
#      in main's shared/pins.json. A live dispatch also needs the actor in
#      SETTLE_OPERATORS. Anything else is a dry run, and no key is passed or
#      written.
#   4. The chain keys are only in the settle job, which runs Python alone
#      (hash-pinned wheels from main's lockfile, nothing runs while
#      installing). The site is built in the deploy job, from exactly the
#      commit the settle job pushed, which never sees a chain key.
#   5. Every action is pinned to a commit. No logs leave the run: there is no
#      artifact, and healthchecks gets a step name and an exit code.
#
# Secrets (Environment "settle"). Stage A (data and site) needs only:
#   GRIDSTATUS_API_KEY                                   fetch
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID          the deploy job only
#   HC_PING_URL, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID    alerts (optional)
# Stage B (chain), only after a separate approval and the oracle-v2 pins:
#   REPORTER_KEYSTORE_JSON, REPORTER_KEYSTORE_PASSWORD   GridOracleV2's reporter,
#                                                        never the first oracle's
#   SETTLER_KEYSTORE_JSON, SETTLER_KEYSTORE_PASSWORD     finalize, resolve, create
# Repository variables:
#   SETTLE_LIVE=yes            fetch, commit, push and redeploy
#   SETTLE_CHAIN=yes           also publish, finalize, resolve and create markets
#   SETTLE_OPERATORS=a,b       GitHub logins that may dispatch a live run
# To stop a run: git push origin HEAD:refs/heads/settle-hold (read at each
# decision point), or gh run cancel <id>. To stop the schedule:
#   gh workflow disable daily-settle
name: daily-settle

on:
  schedule:
    - cron: "20 0,3,9,15 * * *"
  workflow_dispatch:
    inputs:
      live:
        description: "Live run (still needs SETTLE_LIVE=yes, an operator, and SETTLE_CHAIN=yes for the chain)"
        type: boolean
        default: false

concurrency:
  group: daily-settle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  settle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: settle
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.settle.outputs.changed }}
      sha: ${{ steps.settle.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: feat/judging-sprint
          fetch-depth: 0
          # The run pushes its data commits; it never pulls.
          persist-credentials: true

      - name: Decide dry or live (exact comparisons, in bash)
        env:
          WANT_LIVE: ${{ (github.event_name == 'schedule' || inputs.live) && '1' || '0' }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          SETTLE_LIVE_VAR: ${{ vars.SETTLE_LIVE }}
          SETTLE_CHAIN_VAR: ${{ vars.SETTLE_CHAIN }}
          SETTLE_OPERATORS_VAR: ${{ vars.SETTLE_OPERATORS }}
        run: |
          live=0
          chain=0
          if [[ "$WANT_LIVE" == "1" && "$SETTLE_LIVE_VAR" == "yes" ]]; then live=1; fi
          if [[ "$live" == "1" && "$SETTLE_CHAIN_VAR" == "yes" ]]; then chain=1; fi
          if [[ "$EVENT" == "workflow_dispatch" && "$live" == "1" ]]; then
            operator=0
            for name in ${SETTLE_OPERATORS_VAR//,/ }; do
              if [[ "$name" == "$ACTOR" ]]; then operator=1; fi
            done
            if [[ "$operator" != "1" ]]; then
              echo "$ACTOR is not in SETTLE_OPERATORS: this dispatch is a dry run."
              live=0
              chain=0
            fi
          fi
          if [[ "$chain" == "1" ]]; then
            # Stage B only once main pins a GridOracleV2.
            git show "$GITHUB_SHA:shared/pins.json" |
              python3 -c 'import json, sys; sys.exit(0 if json.load(sys.stdin)["oracleV2"] else 1)' || {
              echo "SETTLE_CHAIN=yes, but main's shared/pins.json pins no GridOracleV2; refusing." >&2
              exit 1
            }
          fi
          echo "LIVE=$live" >> "$GITHUB_ENV"
          echo "CHAIN=$chain" >> "$GITHUB_ENV"
          echo "Mode: LIVE=$live CHAIN=$chain (reviewed code: $GITHUB_SHA)"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Python packages (main's lockfile, hash-pinned wheels only)
        run: |
          git show "$GITHUB_SHA:requirements.lock" > "$RUNNER_TEMP/requirements.lock"
          pip install --require-hashes --only-binary=:all: --no-deps -r "$RUNNER_TEMP/requirements.lock"

      - name: Bind the run to the reviewed commit (main's preflight)
        env:
          PYTHON_BIN: python
        run: |
          git config user.name "gridflex-settle-bot"
          git config user.email "gridflex-settle-bot@users.noreply.github.com"
          git show "$GITHUB_SHA:ops/settle-preflight.sh" | bash -s -- settle "$GITHUB_SHA"

      # Raw GridStatus responses: published hashes cite these files, and a
      # cold cache costs extra rows. Evicted after 7 days unused.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Write keystores
        if: env.CHAIN == '1'
        env:
          REPORTER_KEYSTORE_JSON: ${{ secrets.REPORTER_KEYSTORE_JSON }}
          SETTLER_KEYSTORE_JSON: ${{ secrets.SETTLER_KEYSTORE_JSON }}
        run: |
          umask 077
          printf '%s' "$REPORTER_KEYSTORE_JSON" > "$RUNNER_TEMP/reporter.json"
          printf '%s' "$SETTLER_KEYSTORE_JSON" > "$RUNNER_TEMP/settler.json"

      - name: Settle
        id: settle
        env:
          PYTHON_BIN: python
          SETTLE_SECRET_CMD: ops/secret-from-env.sh
          REPORTER_KEYSTORE_PATH: ${{ runner.temp }}/reporter.json
          SETTLER_KEYSTORE_PATH: ${{ runner.temp }}/settler.json
          # Empty unless this is a live chain run.
          REPORTER_KEYSTORE_PASSWORD: ${{ env.CHAIN == '1' && secrets.REPORTER_KEYSTORE_PASSWORD || '' }}
          SETTLER_KEYSTORE_PASSWORD: ${{ env.CHAIN == '1' && secrets.SETTLER_KEYSTORE_PASSWORD || '' }}
          GRIDSTATUS_API_KEY: ${{ env.LIVE == '1' && secrets.GRIDSTATUS_API_KEY || '' }}
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          args=(--no-deploy)
          if [[ "$LIVE" == "1" ]]; then args+=(--live); fi
          if [[ "$CHAIN" == "1" ]]; then args+=(--chain); fi
          ./daily_settle.sh "${args[@]}"

      - name: Remove keystores
        if: always()
        run: rm -f "$RUNNER_TEMP/reporter.json" "$RUNNER_TEMP/settler.json"

  # The site, built and deployed apart from the chain keys, from exactly the
  # commit the settle job pushed: this job gets the Cloudflare token and
  # nothing else, and pushes nothing.
  deploy:
    needs: settle
    if: ${{ !cancelled() && needs.settle.outputs.changed == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: settle
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.settle.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Python packages (main's lockfile, hash-pinned wheels only)
        run: |
          git show "$GITHUB_SHA:requirements.lock" > "$RUNNER_TEMP/requirements.lock"
          pip install --require-hashes --only-binary=:all: --no-deps -r "$RUNNER_TEMP/requirements.lock"

      - name: Check the pushed commit (main's preflight, check only)
        env:
          PUSHED: ${{ needs.settle.outputs.sha }}
          PYTHON_BIN: python
        run: |
          [[ "$PUSHED" =~ ^[0-9a-f]{40}$ ]] || { echo "the settle job reported no commit" >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$PUSHED" ]] || { echo "checked out $(git rev-parse HEAD), not $PUSHED" >&2; exit 1; }
          git checkout --quiet -B feat/judging-sprint
          git show "$GITHUB_SHA:ops/settle-preflight.sh" | bash -s -- check "$GITHUB_SHA"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          # The version is web/package.json's packageManager (S13).
          package_json_file: web/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install site packages (no install scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: web

      - name: Build and deploy exactly the pushed commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ./refresh_data.sh --no-fetch --no-commit
          scripts/check_secrets.sh --build

      - name: Tell Telegram the deploy failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_ID: ${{ github.run_id }}
        run: |
          [[ -n "$TELEGRAM_BOT_TOKEN" && -n "$TELEGRAM_CHAT_ID" ]] || exit 0
          curl -fsS -m 15 -o /dev/null \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=GRIDFLEX settle: the site deploy failed (run ${RUN_ID})." \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" || true
